<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijkstra's Shortest Path</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .controls h2 {
            margin-top: 0;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .graph-area {
            position: relative;
            height: 500px;
            background: white;
            border-radius: 10px;
            border: 2px solid #ddd;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .result {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #1f2937;
            color: white;
        }

        .info {
            background: #e0f2fe;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        @media(max-width: 700px) {
            .graph-area {
                height: 400px;
            }

            input, select, button {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Dijkstra's Shortest Path Algorithm</h1>
    <p>Single Source Shortest Path Visualization</p>
</header>

<div class="container">

    <div class="controls">

        <h2>Graph Controls</h2>

        <label>Source Node:</label>

        <select id="source">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
        </select>

        <button onclick="runDijkstra()">
            Run Dijkstra
        </button>

        <button onclick="resetGraph()">
            Reset
        </button>

        <div class="info">
            <b>Use Case:</b>
            Find the shortest route from one source location
            to all other locations in a weighted network.
        </div>

    </div>

    <div class="graph-area">
        <canvas id="graphCanvas"></canvas>
    </div>

    <div class="result">

        <h2>Shortest Path Results</h2>

        <table>
            <thead>
                <tr>
                    <th>Node</th>
                    <th>Shortest Distance</th>
                    <th>Shortest Path</th>
                </tr>
            </thead>

            <tbody id="resultTable">
                <tr>
                    <td colspan="3">
                        Click "Run Dijkstra" to calculate.
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

<script>

const canvas = document.getElementById("graphCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);


// -----------------------------
// Graph Nodes
// -----------------------------

const nodes = {

    A: { x: 120, y: 100 },
    B: { x: 350, y: 80 },
    C: { x: 600, y: 120 },
    D: { x: 200, y: 300 },
    E: { x: 450, y: 300 },
    F: { x: 700, y: 350 }

};


// -----------------------------
// Weighted Graph
// -----------------------------

const graph = {

    A: {
        B: 4,
        D: 2
    },

    B: {
        A: 4,
        C: 5,
        E: 3
    },

    C: {
        B: 5,
        E: 2,
        F: 3
    },

    D: {
        A: 2,
        E: 6
    },

    E: {
        B: 3,
        C: 2,
        D: 6,
        F: 1
    },

    F: {
        C: 3,
        E: 1
    }

};


// -----------------------------
// Draw Graph
// -----------------------------

function drawGraph(shortestPathEdges = []) {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const scaleX = canvas.width / 820;
    const scaleY = canvas.height / 500;

    // Draw edges

    const drawnEdges = new Set();

    for (let from in graph) {

        for (let to in graph[from]) {

            const edgeId =
                [from, to].sort().join("-");

            if (drawnEdges.has(edgeId))
                continue;

            drawnEdges.add(edgeId);

            const n1 = nodes[from];
            const n2 = nodes[to];

            const x1 = n1.x * scaleX;
            const y1 = n1.y * scaleY;

            const x2 = n2.x * scaleX;
            const y2 = n2.y * scaleY;

            const isShortest =
                shortestPathEdges.includes(edgeId);

            ctx.beginPath();

            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);

            ctx.lineWidth =
                isShortest ? 6 : 2;

            ctx.strokeStyle =
                isShortest ? "#ef4444" : "#777";

            ctx.stroke();

            // Weight

            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;

            ctx.fillStyle = "#111";
            ctx.font = "16px Arial";

            ctx.fillText(
                graph[from][to],
                mx,
                my
            );
        }
    }


    // Draw nodes

    for (let name in nodes) {

        const node = nodes[name];

        const x = node.x * scaleX;
        const y = node.y * scaleY;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            28,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#2563eb";

        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;

        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            name,
            x,
            y
        );
    }

    ctx.textAlign = "start";
    ctx.textBaseline = "alphabetic";
}


// Initial graph

drawGraph();


// -----------------------------
// Dijkstra Algorithm
// -----------------------------

function dijkstra(source) {

    const distances = {};
    const previous = {};
    const unvisited = new Set(Object.keys(graph));

    // Initialize

    for (let node in graph) {

        distances[node] = Infinity;
        previous[node] = null;
    }

    distances[source] = 0;


    while (unvisited.size > 0) {

        let current = null;
        let smallestDistance = Infinity;

        // Find closest unvisited node

        for (let node of unvisited) {

            if (distances[node] < smallestDistance) {

                smallestDistance =
                    distances[node];

                current = node;
            }
        }

        if (current === null)
            break;

        unvisited.delete(current);


        // Update neighbors

        for (let neighbor in graph[current]) {

            const weight =
                graph[current][neighbor];

            const newDistance =
                distances[current] + weight;

            if (newDistance < distances[neighbor]) {

                distances[neighbor] =
                    newDistance;

                previous[neighbor] =
                    current;
            }
        }
    }

    return {
        distances,
        previous
    };
}


// -----------------------------
// Create Path
// -----------------------------

function getPath(previous, source, target) {

    const path = [];

    let current = target;

    while (current !== null) {

        path.unshift(current);

        if (current === source)
            break;

        current = previous[current];
    }

    if (path[0] !== source)
        return [];

    return path;
}


// -----------------------------
// Run Algorithm
// -----------------------------

function runDijkstra() {

    const source =
        document.getElementById("source").value;

    const result =
        dijkstra(source);

    const distances =
        result.distances;

    const previous =
        result.previous;

    const table =
        document.getElementById("resultTable");

    table.innerHTML = "";

    const shortestEdges = [];


    for (let node in graph) {

        const path =
            getPath(
                previous,
                source,
                node
            );

        const row =
            document.createElement("tr");

        const nodeCell =
            document.createElement("td");

        const distanceCell =
            document.createElement("td");

        const pathCell =
            document.createElement("td");


        nodeCell.textContent =
            node;

        distanceCell.textContent =
            distances[node] === Infinity
                ? "∞"
                : distances[node];


        pathCell.textContent =
            path.length > 0
                ? path.join(" → ")
                : "No path";


        row.appendChild(nodeCell);
        row.appendChild(distanceCell);
        row.appendChild(pathCell);

        table.appendChild(row);


        // Highlight path edges

        for (let i = 0; i < path.length - 1; i++) {

            const edgeId =
                [path[i], path[i + 1]]
                .sort()
                .join("-");

            if (!shortestEdges.includes(edgeId)) {

                shortestEdges.push(edgeId);
            }
        }
    }


    drawGraph(shortestEdges);
}


// -----------------------------
// Reset
// -----------------------------

function resetGraph() {

    document.getElementById("resultTable").innerHTML =
        `<tr>
            <td colspan="3">
                Click "Run Dijkstra" to calculate.
            </td>
        </tr>`;

    drawGraph();
}

</script>

</body>
</html>
